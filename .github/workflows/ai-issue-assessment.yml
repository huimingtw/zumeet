name: AI Issue Assessment

on:
  issues:
    types: [labeled]

jobs:
  ai-assessment:
    if: github.event.label.name == 'request ai review'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      models: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Ensure exactly one classification label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels=$(gh issue view ${{ github.event.issue.number }} --json labels --jq '[.labels[].name] | join(" ")')
          has_bug=$(echo "$labels" | grep -cw 'bug' || true)
          has_enh=$(echo "$labels" | grep -cw 'enhancement' || true)
          if [ "$has_bug" -gt 0 ] && [ "$has_enh" -gt 0 ]; then
            # both present: drop enhancement, keep bug
            gh issue edit ${{ github.event.issue.number }} --remove-label enhancement
          elif [ "$has_bug" -eq 0 ] && [ "$has_enh" -eq 0 ]; then
            # neither: default to enhancement
            gh issue edit ${{ github.event.issue.number }} --add-label enhancement
          fi

      - name: Run AI assessment
        id: ai-assessment
        uses: github/ai-assessment-comment-labeler@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_number: ${{ github.event.issue.number }}
          issue_body: ${{ github.event.issue.body }}
          repo_name: ${{ github.event.repository.name }}
          owner: ${{ github.repository_owner }}
          ai_review_label: request ai review
          prompts_directory: ./Prompts
          labels_to_prompts_mapping: bug,bug-review.prompt.yml;enhancement,feature-review.prompt.yml
